<html lang="ko">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Weekly Meal - Homekeeper</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --primary:#6B3FA0;--primary-light:#8B5EC7;--primary-pale:#F0E8FF;
  --accent:#FF6B6B;--green:#2ECC71;--orange:#FF9F43;
  --bg:#F7F5FF;--card:#FFFFFF;--text:#1A1A2E;--text-sub:#8B8BA0;
  --border:#EDE8F5;--shadow:0 4px 24px rgba(107,63,160,0.08);
}
body{font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;background:var(--bg);display:flex;justify-content:center;min-height:100vh;}
#app{width:100%;max-width:480px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;}
.screen{flex:1;overflow-y:auto;padding-bottom:80px;}
.tab-bar{position:fixed;bottom:0;width:100%;max-width:480px;display:flex;background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);z-index:50;padding-bottom:env(safe-area-inset-bottom,0);}
.tab-btn{flex:1;padding:12px 0 10px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;}
button{cursor:pointer;font-family:inherit;border:none;}
input,select{font-family:inherit;}
.pad{padding:32px 20px 20px;}
.px{padding:0 20px;}
.title{font-weight:800;font-size:24px;letter-spacing:-0.5px;color:var(--text);}
.sub{font-size:13px;color:var(--text-sub);margin-top:6px;line-height:1.5;}
.back{background:var(--card);border:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:16px;box-shadow:var(--shadow);color:var(--text);}
.sec{font-size:11px;font-weight:700;color:var(--text-sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);}
.btn-p{background:var(--primary);color:#fff;border-radius:16px;padding:16px;font-weight:700;font-size:15px;width:100%;}
.btn-p:disabled{background:#D0C8E0;color:#A09AB0;}
.btn-g{background:var(--green);color:#fff;border-radius:16px;padding:16px;font-weight:700;font-size:15px;width:100%;}
.btn-o{background:var(--orange);color:#fff;border-radius:16px;padding:16px;font-weight:700;font-size:15px;width:100%;}
.btn-gray{background:#F0EDF8;color:var(--text-sub);border-radius:16px;padding:16px;font-weight:600;font-size:15px;width:100%;}
.bottom-bar{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 20px;background:rgba(247,245,255,0.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);z-index:20;}
.inp{padding:13px 16px;border-radius:14px;border:1.5px solid var(--border);font-size:14px;outline:none;background:#fff;color:var(--text);}
.inp:focus{border-color:var(--primary);}
.sel{padding:13px 10px;border-radius:14px;border:1.5px solid var(--border);font-size:13px;outline:none;background:#fff;color:var(--text);}
.fi{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);border-radius:16px;margin-bottom:8px;box-shadow:0 2px 8px rgba(107,63,160,0.06);}
.fi.urgent{background:#FFF0F0;border:1.5px solid #FFD0D0;}
.fi.warning{background:#FFFBF0;border:1.5px solid #FFE8B0;}
.dday{color:#fff;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;display:inline-block;}
.day-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 14px;scrollbar-width:none;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{flex-shrink:0;min-width:48px;height:48px;border-radius:16px;border:2px solid var(--border);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;transition:all 0.2s;}
.day-tab.active{background:var(--primary);border-color:var(--primary);}
.meal-card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);}
.mtag{background:var(--primary-pale);color:var(--primary);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;display:inline-block;margin:2px;}
.stag{background:#E8F5E9;color:#2E7D32;border-color:#A5D6A7;}
.shop-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-radius:16px;margin-bottom:8px;box-shadow:0 2px 8px rgba(107,63,160,0.05);}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;}
.chk.done{background:var(--green);border-color:var(--green);}
.modal-bg{position:fixed;inset:0;background:rgba(26,26,46,0.6);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal-card{background:#fff;border-radius:28px 28px 0 0;padding:28px 20px 44px;width:100%;max-width:480px;}
.overlay{position:fixed;inset:0;background:rgba(26,26,46,0.92);backdrop-filter:blur(12px);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
.ad-box{width:320px;height:180px;background:linear-gradient(135deg,#1A1A2E,#4A0080);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.load-popup{position:fixed;inset:0;background:rgba(26,26,46,0.6);backdrop-filter:blur(8px);z-index:998;display:flex;align-items:flex-end;justify-content:center;}
.load-card{background:#fff;border-radius:28px 28px 0 0;padding:32px 24px 48px;width:100%;max-width:480px;text-align:center;}
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;background:linear-gradient(160deg,var(--primary-pale),#fff);}
.menu-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;font-size:13px;border:1.5px solid var(--border);background:#fff;color:var(--text-sub);margin:3px;}
.menu-chip.sel{background:var(--primary-pale);border-color:var(--primary);color:var(--primary);font-weight:700;}
.entry-btn{width:100%;border-radius:20px;padding:20px;display:flex;align-items:center;gap:16px;text-align:left;margin-bottom:12px;border:none;box-shadow:var(--shadow);}
.meal-slot-btn{flex:1;padding:10px 4px;border-radius:12px;border:2px solid var(--border);background:#fff;font-size:11px;font-weight:600;color:var(--text-sub);text-align:center;}
.meal-slot-btn.on-b{border-color:#FF9F43;background:#FFF8EE;color:#E07000;}
.meal-slot-btn.on-l{border-color:var(--primary);background:var(--primary-pale);color:var(--primary);}
.meal-slot-btn.on-d{border-color:var(--accent);background:#FFF0F0;color:#CC3333;}
.badge{display:inline-block;border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;}
@keyframes splashLoad{from{width:0}to{width:100%}}
@keyframes loadBar{0%{width:0%;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0%;margin-left:100%}}
</style>
</head>

// ── 조리시간 매핑 ──
function getCookTime(menuName){
  const rules=[
    // 60분+ - 오래 걸리는 요리 (먼저 체크)
    {keywords:["갈비찜","갈비탕","설렁탕","곰탕","삼계탕","백숙","사골","보쌈","수육","족발","동파","홍소","꼬리찜","소꼬리"], time:60},
    // 35분 - 솥밥
    {keywords:["솥밥"], time:35},
    // 30분 - 조림/찜/스튜
    {keywords:["조림","찜","라멘","카레","스튜","수프","피자","스테이크","추어탕","감자탕"], time:30},
    // 25분 - 구이/전/튀김/파스타
    {keywords:["구이","전","튀김","강정","가라아게","데리야끼","파스타","리조또","짜장","짬뽕","탕수"], time:25},
    // 20분 - 볶음/찌개
    {keywords:["볶음","찌개","된장","순두부","청국장","전골","수제비","칼국수","덮밥","규동","오야코","가츠동","잡채"], time:20},
    // 15분 - 빠른 밥/면
    {keywords:["볶음밥","라면","국수","우동","소바","야키소바","볶음면","냉면","비빔면","비빔밥","죽"], time:15},
    // 10분 - 간단 요리
    {keywords:["계란말이","오믈렛","토스트","샌드위치","냉국","무침","겉절이","냉채","샐러드"], time:10},
    // 5분 - 즉석
    {keywords:["계란후라이","스크램블","온천계란","냉두부","연두부무침","참기름계란밥","버터간장밥","명란버터밥","참치마요밥","계란찜"], time:5},
  ];
  for(const rule of rules){
    if(rule.keywords.some(kw=>menuName.includes(kw))) return rule.time;
  }
  return 20; // 기본값
}


// ── 쿠팡 파트너스 설정 ──
const COUPANG_PARTNER_ID = "YOUR_PARTNER_ID"; // 실제 파트너스 ID로 교체
const COUPANG_SUB_ID = "weeklymeal";

function getCoupangUrl(keyword){
  // 쿠팡 파트너스 검색 링크
  const encoded = encodeURIComponent(keyword);
  return `https://coupa.ng/search?q=${encoded}&partner=${COUPANG_PARTNER_ID}&subId=${COUPANG_SUB_ID}`;
}

function getMarketKurlyUrl(keyword){
  return `https://www.kurly.com/search?sword=${encodeURIComponent(keyword)}`;
}

function getShoppingUrl(keyword, prefer="coupang"){
  if(prefer==="kurly") return getMarketKurlyUrl(keyword);
  return getCoupangUrl(keyword);
}

function getIngredientShopUrl(ingName){
  // 정확한 매칭
  if(INGREDIENT_SHOP[ingName]){
    const s=INGREDIENT_SHOP[ingName];
    return {url:getShoppingUrl(s.query,s.shop), query:s.query};
  }
  // 부분 매칭
  for(const[k,v]of Object.entries(INGREDIENT_SHOP)){
    if(ingName.includes(k)||k.includes(ingName)){
      return {url:getShoppingUrl(v.query,v.shop), query:v.query};
    }
  }
  // 기본: 쿠팡 검색
  return {url:getCoupangUrl(ingName), query:ingName};
}

function scaleAmt(amount, people){
  if(people===1||!amount)return amount;
  const num=parseFloat(amount);
  if(!num||isNaN(num))return amount;
  const unit=amount.replace(/[0-9./]/g,'').trim();
  const scaled=Math.round(num*people*10)/10;
  return scaled+unit;
}

function getBrands(side){
  // 직접 매핑
  if(BRAND_DB[side]) return BRAND_DB[side].filter(b=>new Date(b.until)>=new Date());
  // 키워드 매핑
  const keys=Object.keys(BRAND_DB);
  for(const k of keys) if(side.includes(k)||k.includes(side)) return(BRAND_DB[k]||[]).filter(b=>new Date(b.until)>=new Date());
  return(BRAND_DB.기타||[]).filter(b=>new Date(b.until)>=new Date());
}

// 메뉴명 기반으로 재료명 정밀화
function refineIngredient(ingName, menuName){
  try{
    // 정확한 키로 먼저 찾기
    let rules = INGREDIENT_REFINE[ingName];
    // 없으면 부분 매칭
    if(!rules){
      for(const key of Object.keys(INGREDIENT_REFINE)){
        if(ingName.includes(key)||key.includes(ingName)){
          rules=INGREDIENT_REFINE[key];
          break;
        }
      }
    }
    // rules가 배열인지 반드시 체크
    if(!rules||!Array.isArray(rules)) return ingName;
    for(const rule of rules){
      if(!rule||!Array.isArray(rule.keywords)) continue;
      if(rule.keywords.some(kw=>menuName.includes(kw))){
        return rule.name||ingName;
      }
    }
    return ingName;
  }catch(e){
    return ingName; // 오류 시 원래 이름 그대로
  }
}

function getIngredientsFromDB(menus, people){
  const merged={};
  let allFound=true;
  const fridgeNames=S.fridge.map(f=>f.name);
  for(const menu of menus){
    const db=MENU_DB[menu];
    if(!db){allFound=false;continue;}
    for(const ing of db.ingredients){
      // 메뉴명 기반으로 재료명 정밀화
      const refinedName = refineIngredient(ing.name, menu);
      const qty=parseFloat(ing.amount)||0;
      const unit=ing.amount.replace(/[0-9.]/g,'').trim();
      const key = refinedName;
      // 냉장고에 있는지 체크
      const inFridge=fridgeNames.some(f=>f.includes(refinedName)||refinedName.includes(f));
      if(merged[key]){
        const ex=parseFloat(merged[key].amount)||0;
        if(ex&&qty) merged[key].amount=Math.round((ex+qty)*people*10)/10+unit;
      } else {
        merged[key]={...ing, name:refinedName, amount:qty?Math.round(qty*people*10)/10+unit:ing.amount, inFridge};
      }
    }
  }
  return{list:Object.values(merged),allFound};
}

// ── 라우터 ──
function go(s){S.screen=s;render();}

function render(){
  const s=S.screen;
  const noTab=["splash","api","onboard"].includes(s);
  let html='<div class="screen">';
  if(s==="splash") html+=rSplash();
  else if(s==="api") html+=rApi();
  else if(s==="onboard") html+=rOnboard();
  else if(s==="home") html+=rHome();
  else if(s==="schedule") html+=rSchedule();
  else if(s==="a-fridge") html+=rAFridge();
  else if(s==="a-style") html+=rAStyle();
  else if(s==="a-meal") html+=rMeal("a-meal","#F1F8E9");
  else if(s==="bc-entry") html+=rBCEntry();
  else if(s==="b-suggest") html+=rBSuggest();
  else if(s==="bc-cart") html+=rBCCart();
  else if(s==="bc-meal") html+=rMeal("bc-meal","#FCE4EC");
  else if(s==="recipe") html+=rRecipe();
  else if(s==="tab-fridge") html+=rFridgeTab();
  else if(s==="tab-meal") html+=rMealTab();
  else if(s==="tab-cart") html+=rCartTab();
  html+='</div>';
  if(!noTab){
    const tabs=[{k:"home",i:"🏠",l:"홈"},{k:"tab-fridge",i:"❄️",l:"냉장고"},{k:"tab-meal",i:"📅",l:"식단표"},{k:"tab-cart",i:"🛒",l:"장보기"}];
    html+=`<div class="tab-bar">${tabs.map(t=>`<button class="tab-btn" onclick="go('${t.k}')"><div style="width:28px;height:28px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;background:${S.screen===t.k?"var(--primary-pale)":"transparent"}">${t.i}</div><span style="font-size:10px;color:${S.screen===t.k?"var(--primary)":"var(--text-sub)"};font-weight:${S.screen===t.k?700:500}">${t.l}</span>${t.k==="tab-cart"&&S.cart.length>0?'<span style="position:absolute;top:8px;right:10px;width:7px;height:7px;background:var(--accent);border-radius:50%"></span>':""}</button>`).join("")}</div>`;
  }
  document.getElementById("app").innerHTML=html;
}

          <div style="font-size:9px;color:${i<=current?"var(--primary)":"#bbb"};font-weight:600;margin-top:4px;text-align:center;white-space:nowrap">${s}</div>
        </div>

function rSchedule(){
  return`<div class="pad"><button class="back" onclick="go('home')">←</button><div class="title">🍽️ 식사 스케줄 설정</div><div class="sub">요일별로 드실 끼니를 선택해주세요</div></div>
  <div class="px" style="padding-bottom:120px">
    ${DAYS.map(day=>`<div class="card" style="margin-bottom:10px"><div style="font-weight:700;font-size:14px;margin-bottom:10px">${day}요일</div><div style="display:flex;gap:6px">${["아침","점심","저녁"].map(m=>{const on=(S.schedule[day]||[]).includes(m);const cls=on?"meal-slot-btn on-"+(m==="아침"?"b":m==="점심"?"l":"d"):"meal-slot-btn";return`<button class="${cls}" onclick="toggleSlot('${day}','${m}')">${m==="아침"?"🌅":m==="점심"?"☀️":"🌙"}<br>${m}</button>`;}).join("")}</div></div>`).join("")}
    <div style="background:#E8F5E9;border-radius:14px;padding:14px;margin-top:8px;text-align:center"><div style="font-size:13px;color:#2e7d32;font-weight:700">총 ${totalMeals()}끼 설정됨</div></div>
  </div>
  <div class="bottom-bar"><button class="btn-p" onclick="saveSched();go('home')">설정 완료 →</button></div>`;
}
function toggleSlot(day,meal){
  if(!S.schedule[day])S.schedule[day]=[];
  const i=S.schedule[day].indexOf(meal);
  if(i>=0)S.schedule[day].splice(i,1);else S.schedule[day].push(meal);
  S.schedule[day].sort((a,b)=>["아침","점심","저녁"].indexOf(a)-["아침","점심","저녁"].indexOf(b));
  render();
}

// ── A: 식단 생성 ──
function genAMeal(){
  if(!checkUsage())return;

  const fridgeNames=S.fridge.map(f=>f.name);
  const MIN_INGREDIENTS=5; // 최소 재료 수

  // ① 재료 부족 체크
  if(fridgeNames.length<MIN_INGREDIENTS){
    showInsufficientModal(fridgeNames.length);
    return;
  }

  // ② 캐시 확인
  const cacheKey=getCacheKey(S.fridge,S.bcStyles,S.people);
  const cached=getCache(cacheKey);
  if(cached){S.mealPlan=cached;S.mealStartDate=getThisMonday();saveMeal();go("a-meal");return;}

  // ③ 스타일별 메뉴 풀
  const styleMap={
    "한식":["두부된장찌개","버섯된장찌개","돼지고기김치찌개","참치김치찌개","해물순두부찌개","고기순두부찌개",
            "고추장제육볶음","간장제육볶음","마늘삼겹살구이","된장삼겹살구이","간장불고기","파불고기",
            "소고기비빔밥","나물비빔밥","감자닭볶음탕","간장닭볶음탕","무갈비찜","간장갈비찜",
            "고추장오징어볶음","김치삼겹살볶음밥","불고기볶음밥","계란간장덮밥","콩나물해장국",
            "잔치국수온면","춘천식닭갈비","간장계란찜","아욱국","시금치국","된장찌개","김치찌개"],
    "일식":["오야코동","규동일식","가츠동","연어덮밥일식","쇼유라멘","된장라멘","하카타라멘",
            "유부우동","카케우동","닭가슴살데리야끼","연어데리야끼","가라아게","일식샤부샤부","연어미소구이"],
    "중식":["마파두부","마파순두부","짜장면","계란볶음밥중식","소고기브로콜리볶음",
            "청경채볶음","사천마라새우","광동식해물볶음","레몬닭볶음"],
    "양식":["카르보나라","마늘올리브파스타","봉골레화이트파스타","토마토새우파스타","크림새우파스타",
            "시금치크림파스타","새우리조또","버섯리조또","레몬허브치킨","발사믹치킨"],
  };

  const pool=S.bcStyles.flatMap(s=>styleMap[s]||styleMap["한식"]);

  // ④ 냉장고 재료로 만들 수 있는 메뉴 필터링
  // 핵심재료(단백질/채소)의 절반 이상이 냉장고에 있어야 선택
  const cookable=pool.filter(name=>{
    const db=MENU_DB[name];
    if(!db)return false;
    const keyIngs=db.ingredients.filter(i=>i.category==="단백질"||i.category==="채소");
    if(!keyIngs.length)return true;
    const have=keyIngs.filter(i=>fridgeNames.some(f=>f.includes(i.name)||i.name.includes(f)));
    return have.length >= Math.ceil(keyIngs.length*0.5); // 50% 이상 보유
  });

  // ⑤ 만들 수 있는 메뉴가 너무 적으면 안내
  if(cookable.length<3){
    showInsufficientMenuModal(cookable.length, fridgeNames);
    return;
  }

  // ⑥ 재료 겹침 점수로 정렬
  const scored=cookable.map(name=>{
    const db=MENU_DB[name];
    const overlap=db.ingredients.filter(i=>fridgeNames.some(f=>f.includes(i.name)||i.name.includes(f))).length;
    return{name,score:overlap};
  }).sort((a,b)=>b.score-a.score);

  const selected=scored.map(s=>s.name);

  // ⑦ 식단 배치
  const weeklyMeal=[];
  const lightMenus=["계란토스트","계란후라이","스크램블계란","오트밀죽","바나나오트밀","참기름계란밥","버터간장밥","명란버터밥","참치마요밥"];
  let idx=0;
  for(const day of DAYS){
    const slots=S.schedule[day]||[];
    if(!slots.length){weeklyMeal.push({day,meals:[]});continue;}
    const meals=[];
    for(const type of slots){
      let name;
      if(type==="아침"){
        // 아침은 간단한 메뉴 - 냉장고에 계란 있으면 계란 메뉴 우선
        const hasEgg=fridgeNames.some(f=>f.includes("계란")||f.includes("달걀"));
        const lightPool=hasEgg?lightMenus:lightMenus.filter(m=>!m.includes("계란"));
        name=lightPool[idx%lightPool.length];
      } else {
        name=selected[idx%selected.length];
      }
      idx++;
      const db=MENU_DB[name];
      meals.push({type,name,mainIngredients:db?db.ingredients.slice(0,3).map(i=>i.name):[],cookTime:getCookTime(name),nutrition:{protein:"중간",carb:"높음",veggie:"있음"},sides:getSides(name,type)});
    }
    weeklyMeal.push({day,meals});
  }

  const coverRate=Math.round(cookable.length/pool.length*100);
  const result={weeklyMeal,tip:`냉장고 재료로 ${cookable.length}개 메뉴를 만들 수 있어요 (${S.bcStyles.join("+")} 스타일 기준 ${coverRate}% 커버)`};
  addUsage();
  S.mealPlan=result;
  S.mealStartDate=getThisMonday();
  saveMeal();
  saveCache(cacheKey,result);
  go("a-meal");
}

function showAutoComplete(val){
  const drop=document.getElementById("ac-drop");
  if(!drop)return;
  const q=val.trim();
  if(q.length<1){drop.style.display="none";return;}

  // DB에서 부분일치 검색 - 입력값이 포함된 메뉴 찾기
  const keys=Object.keys(MENU_DB);
  const results=keys.filter(k=>k.includes(q)).slice(0,8);

  // 없으면 초성/키워드로 넓게 검색
  const extra = results.length < 4
    ? keys.filter(k=>!results.includes(k) && (
        k.replace(/찌개|볶음|구이|조림|나물|무침|전골|탕|국/g,"").includes(q) ||
        q.replace(/찌개|볶음|구이|조림|나물|무침|전골|탕|국/g,"").length>0 && k.includes(q.replace(/찌개|볶음|구이|조림|나물|무침|전골|탕|국/g,""))
      )).slice(0, 8-results.length)
    : [];

  const all=[...results,...extra];
  if(!all.length){drop.style.display="none";return;}

  drop.innerHTML=all.map(name=>{
    const db=MENU_DB[name];
    const cat=db?.ingredients.find(i=>i.category==="단백질")?.name||"";
    const highlighted=name.replace(new RegExp(q,"g"),`<span style="color:var(--primary);font-weight:800">${q}</span>`);
    return`<div onclick="selectAC('${name}')" style="padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:10px;active:background:#f5f5f5">
      <div style="flex:1">
        <div style="font-size:14px;font-weight:600">${highlighted}</div>
        ${cat?`<div style="font-size:11px;color:#aaa">주재료: ${cat}</div>`:""}
      </div>
      <span style="font-size:11px;color:var(--primary);font-weight:700">선택</span>
    </div>`;
  }).join("");
  drop.style.display="block";
}

function selectAC(name){

  const drop=document.getElementById("ac-drop");

// 재료 겹치는 메뉴 찾기 - 여러 메뉴 재료 합산 기준
function findSimilarMenus(menuNames, exclude=[]){
  // 여러 메뉴의 재료를 모두 합산
  const allIngs=new Set();
  for(const name of (Array.isArray(menuNames)?menuNames:[menuNames])){
    const db=MENU_DB[name];
    if(db)db.ingredients.forEach(i=>allIngs.add(i.name));
  }
  if(!allIngs.size)return[];
  const scores={};
  for(const[k,v]of Object.entries(MENU_DB)){
    if(exclude.includes(k))continue;
    const overlap=v.ingredients.filter(i=>allIngs.has(i.name)).length;
    if(overlap>0)scores[k]=overlap;
  }
  return Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,30).map(x=>x[0]);
}

// 상위 카테고리 → 하위 메뉴 변환
function resolveMenu(menuName){
  // 1. 정확히 DB에 있으면 그대로
  if(MENU_DB[menuName])return menuName;
  // 2. 카테고리맵에 있으면 랜덤으로 하위 선택
  if(CATEGORY_MAP[menuName]){
    const subs=CATEGORY_MAP[menuName].filter(m=>MENU_DB[m]);
    if(subs.length)return subs[Math.floor(Math.random()*subs.length)];
  }
  // 3. 부분 일치로 찾기 (예: "된장" → "두부된장찌개")
  const keys=Object.keys(MENU_DB);
  const partial=keys.filter(k=>k.includes(menuName)||menuName.includes(k));
  if(partial.length)return partial[Math.floor(Math.random()*partial.length)];
  // 4. 카테고리맵 부분 일치
  for(const[cat,subs]of Object.entries(CATEGORY_MAP)){
    if(cat.includes(menuName)||menuName.includes(cat)){
      const valid=subs.filter(m=>MENU_DB[m]);
      if(valid.length)return valid[Math.floor(Math.random()*valid.length)];
    }
  }
  return null;
}

function genBCCart(){
  try{
    const max=totalMeals();

    // 1. 입력한 메뉴를 하위 메뉴로 변환
    const resolved=S.bcMenus.map(m=>resolveMenu(m)).filter(Boolean);
    const unique=[...new Set(resolved)];

    // 2. 재료 겹치는 메뉴로 나머지 채우기
    let pool=[...unique];
    if(pool.length>0 && pool.length<max){
      const similar=findSimilarMenus(pool, pool);
      const need=max-pool.length;
      pool=[...pool,...similar.slice(0,need)];
    }

    // 3. 부족하면 DB에서 랜덤 추가
    if(pool.length<max){
      const dbMenus=Object.keys(MENU_DB);
      const extra=dbMenus.filter(k=>!pool.includes(k)).sort(()=>Math.random()-0.5).slice(0,max-pool.length);
      pool=[...pool,...extra];
    }

    S.bcMenus=pool;

    // 4. 장보기 목록 생성
    const {list}=getIngredientsFromDB(S.bcMenus,S.people);
    S.cart=list.map(i=>({...i,checked:i.inFridge||false,replaceName:"",replaceQty:""}));
    S.fridgeAdded=false;
    go("bc-cart");
  }catch(e){
    console.error("genBCCart 오류:",e);
    alert("재료 분석 중 오류가 발생했어요: "+e.message);
  }
}

let _cartIdx=-1;
function openEditCart(idx){_cartIdx=idx;document.getElementById("cart-modal-name").textContent=S.cart[idx].name;document.getElementById("cart-rep-name").value=S.cart[idx].replaceName||"";document.getElementById("cart-rep-qty").value=S.cart[idx].replaceQty||S.cart[idx].amount;document.getElementById("cart-modal").style.display="flex";}
function confirmEditCart(){const n=document.getElementById("cart-rep-name").value.trim();const q=document.getElementById("cart-rep-qty").value.trim();if(n)S.cart[_cartIdx].replaceName=n;if(q)S.cart[_cartIdx].replaceQty=q;document.getElementById("cart-modal").style.display="none";render();}

function addToFridge(){
  for(const item of S.cart.filter(i=>i.checked)){
    const name=item.replaceName||item.name;
    const amt=item.replaceQty||item.amount;
    if(!S.fridge.find(f=>f.name===name)){
      S.fridge.push({name,qty:amt.replace(/[^0-9.]/g,"")||"적당량",unit:amt.replace(/[0-9.]/g,"").trim()||"",icon:item.icon||getIcon(name),addedAt:new Date().toISOString().slice(0,10),expireDays:14});
    }
  }
  saveFridge();S.fridgeAdded=true;render();
}

function goMakeMeal(){
  const fridgeNames=S.fridge.map(f=>f.name);
  const cookable=[],uncookable=[];
  for(const menuName of S.bcMenus){
    const db=MENU_DB[menuName];
    if(!db){cookable.push(menuName);continue;}
    const missing=db.ingredients.filter(i=>i.category==="단백질"&&!fridgeNames.some(f=>f.includes(i.name)||i.name.includes(f)));
    if(missing.length<=1)cookable.push(menuName);
    else uncookable.push({menu:menuName,missing:missing.map(i=>i.name)});
  }
  const pool=cookable.length>0?cookable:S.bcMenus;
  const weeklyMeal=[];
  let idx=0;
  for(const day of DAYS){
    const slots=S.schedule[day]||[];
    if(!slots.length){weeklyMeal.push({day,meals:[]});continue;}
    const meals=[];
    for(const type of slots){
      const name=pool[idx%pool.length];idx++;
      const db=MENU_DB[name];
      meals.push({type,name,mainIngredients:db?db.ingredients.slice(0,3).map(i=>i.name):[],cookTime:getCookTime(name),nutrition:{protein:"중간",carb:"높음",veggie:"있음"},sides:getSides(name,type)});
    }
    weeklyMeal.push({day,meals});
  }
  S.mealPlan={weeklyMeal,tip:`${pool.length}개 메뉴로 구성했어요`};
  S.mealStartDate=getThisMonday();
  saveMeal();addUsage();
  if(uncookable.length>0){
    const warns=uncookable.map(u=>`⚠️ "${u.menu}"은(는) ${u.missing.join(", ")} 재료가 없어요`);
    showWarn(warns);
  } else go("bc-meal");
}

function showWarn(warns){
  const el=document.createElement("div");
  el.style.cssText="position:fixed;inset:0;background:rgba(26,26,46,0.7);z-index:999;display:flex;align-items:flex-end;justify-content:center";
  el.innerHTML=`<div style="background:#fff;border-radius:24px 24px 0 0;padding:28px 20px 44px;width:100%;max-width:480px"><div style="font-weight:800;font-size:17px;margin-bottom:4px">⚠️ 일부 메뉴를 만들 수 없어요</div><div style="font-size:13px;color:#888;margin-bottom:16px">재료가 없어 다른 메뉴로 대체했어요</div>${warns.map(w=>`<div style="background:#fff8f0;border:1px solid #ffe0b2;border-radius:10px;padding:10px 12px;font-size:13px;color:#e65100;margin-bottom:8px">${w}</div>`).join("")}<button onclick="closePopup();go('bc-meal')" style="width:100%;margin-top:16px;padding:15px;background:var(--primary);color:#fff;border:none;border-radius:14px;font-weight:700;font-size:15px">식단 확인하기</button></div>`;

}

  <div id="ft-modal" style="display:none" class="modal-bg"><div class="modal-card">
    <div style="font-weight:800;font-size:17px;margin-bottom:16px" id="ft-title">재료 추가</div>
    <div style="margin-bottom:10px"><div class="sec" style="margin-bottom:4px">재료명</div><input id="ft-name" class="inp" style="width:100%"></div>
    <div style="display:flex;gap:8px;margin-bottom:10px"><div style="flex:2"><div class="sec" style="margin-bottom:4px">수량</div><input id="ft-qty" type="number" class="inp" style="width:100%"></div><div style="flex:1"><div class="sec" style="margin-bottom:4px">단위</div><select id="ft-unit" class="sel" style="width:100%"><option>g</option><option>ml</option><option>개</option><option>큰술</option><option>봉지</option></select></div></div>
    <div style="margin-bottom:16px"><div class="sec" style="margin-bottom:4px">유통기한(일)</div><input id="ft-exp" type="number" class="inp" style="width:100%" value="14"></div>
    <button class="btn-p" onclick="confirmFridgeTab()">추가</button>
    <button onclick="document.getElementById('ft-modal').style.display='none'" style="width:100%;padding:12px;background:none;border:none;color:#aaa;font-size:14px;margin-top:6px">취소</button>
  </div></div>`;
}
let _ftIdx=-1;
function openAddFridgeTab(){_ftIdx=-1;document.getElementById("ft-title").textContent="재료 추가";document.getElementById("ft-name").value="";document.getElementById("ft-qty").value="";document.getElementById("ft-exp").value="14";document.getElementById("ft-modal").style.display="flex";}
function editFridgeTab(i){_ftIdx=i;const f=S.fridge[i];document.getElementById("ft-title").textContent="재료 수정";document.getElementById("ft-name").value=f.name;document.getElementById("ft-qty").value=f.qty;document.getElementById("ft-unit").value=f.unit||"g";document.getElementById("ft-exp").value=f.expireDays||14;document.getElementById("ft-modal").style.display="flex";}
function confirmFridgeTab(){const n=document.getElementById("ft-name").value.trim();const q=document.getElementById("ft-qty").value;const u=document.getElementById("ft-unit").value;const e=parseInt(document.getElementById("ft-exp").value)||14;if(!n)return;const item={name:n,qty:q||"적당량",unit:q?u:"",icon:getIcon(n),addedAt:new Date().toISOString().slice(0,10),expireDays:e};if(_ftIdx>=0)S.fridge[_ftIdx]=item;else S.fridge.push(item);saveFridge();document.getElementById("ft-modal").style.display="none";render();}

// ── 탭: 식단표 ──
function rMealTab(){
  const plan=S.mealPlan;
  if(!plan)return`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;padding:20px"><div style="font-size:52px">📅</div><div style="font-weight:700;font-size:18px">아직 식단이 없어요</div><button class="btn-p" style="width:auto;padding:12px 24px" onclick="go('home')">홈으로 가기</button></div>`;
  const tIcon={"아침":"🌅","점심":"☀️","저녁":"🌙"};
  return`<div class="pad"><div class="title">📅 이번 주 식단</div>${S.mealStartDate?`<div class="sub">${S.mealStartDate} 시작</div>`:""}</div>
  <div class="day-tabs">
    ${DAYS.map((d,i)=>{const meals=plan.weeklyMeal?.[i]?.meals||[];return`<button class="day-tab ${S.currentDay===i?"active":""}" onclick="S.currentDay=${i};render()"><span style="font-size:11px;font-weight:700;color:${S.currentDay===i?"#fff":"#888"}">${d}</span><span style="font-size:9px;color:${S.currentDay===i?"rgba(255,255,255,0.7)":"#ccc"}">${meals.length}끼</span></button>`;}).join("")}
  </div>
  <div class="px" style="padding-bottom:20px">
    ${(plan.weeklyMeal?.[S.currentDay]?.meals||[]).map((m,mi)=>`
    <div class="meal-card" onclick="S.currentMeal=S.mealPlan.weeklyMeal[S.currentDay].meals[${mi}];S.recipeBack='tab-meal';go('recipe')">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span>${tIcon[m.type]||""}</span><span style="font-size:10px;color:#aaa;font-weight:700">${m.type}</span></div>
      <div style="font-weight:700;font-size:14px">${m.name}</div>
      ${m.cookTime?`<div style="font-size:11px;color:#f57c00;margin-top:2px">⏱ ${m.cookTime}분</div>`:""}
    </div>`).join("")||`<div style="text-align:center;color:#ccc;padding:24px">이 날은 식사 계획이 없어요</div>`}
  </div>`;
}

// ── 탭: 장보기 ──
function rCartTab(){
  if(!S.cart||S.cart.length===0)return`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;padding:20px"><div style="font-size:52px">🛒</div><div style="font-weight:700;font-size:18px">장보기 목록이 없어요</div><button class="btn-p" style="width:auto;padding:12px 24px" onclick="go('home')">홈으로 가기</button></div>`;
  const cats=["채소","단백질","양념","면·밥","기타"];
  const catIcon={채소:"🥬",단백질:"🥩",양념:"🧄","면·밥":"🍚",기타:"🛒"};
  const done=S.cart.filter(i=>i.checked).length;
  return`<div class="pad"><div class="title">🛒 장보기 목록</div><div style="display:flex;align-items:center;gap:8px;margin-top:8px"><div style="flex:1;height:5px;background:var(--border);border-radius:4px;overflow:hidden"><div style="height:100%;background:var(--green);width:${S.cart.length?Math.round(done/S.cart.length*100):0}%;border-radius:4px"></div></div><span style="font-size:12px;color:#aaa">${done}/${S.cart.length}</span></div></div>
  <div class="px" style="padding-bottom:20px">
    ${cats.map(cat=>{const items=S.cart.filter(i=>(i.category||"기타")===cat);if(!items.length)return"";return`<div style="margin-bottom:14px"><div class="sec">${catIcon[cat]} ${cat}</div>${items.map(item=>{const idx=S.cart.indexOf(item);const hf=item.inFridge;
      return`<div class="shop-item" style="background:${hf?"#F0FFF6":"#fff"};border:1.5px solid ${hf?"#A5D6A7":"transparent"}">
        <div class="chk ${item.checked?"done":""}" onclick="S.cart[${idx}].checked=!S.cart[${idx}].checked;render()">${item.checked?'<span style="color:#fff;font-size:11px">✓</span>':""}</div>
        <span style="font-size:20px">${item.icon||"🥬"}</span>
        <div style="flex:1" onclick="S.cart[${idx}].checked=!S.cart[${idx}].checked;render()">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-weight:600;font-size:14px;text-decoration:${item.checked?"line-through":"none"};color:${item.checked?"#bbb":"var(--text)"}">${item.replaceName||item.name}</span>
            ${hf?'<span style="font-size:10px;background:#2ECC71;color:#fff;border-radius:6px;padding:1px 6px;font-weight:700">냉장고✓</span>':""}
          </div>
          <div style="font-size:11px;color:#aaa">${item.replaceQty||item.amount}</div>
        </div>
      </div>`;}).join("")}</div>`;}).join("")}
  </div>`;
}


function renderSideAds(sides){
  const brands=[];const shown=new Set();
  for(const s of sides){
    for(const b of getBrands(s)){
      if(!shown.has(b.name)){
        shown.add(b.name);brands.push({...b,side:s});
        if(brands.length>=2)break;
      }
    }
    if(brands.length>=2)break;
  }
  if(!brands.length)return"";
  return`<div style="display:flex;gap:6px">${brands.map(b=>`
    <a href="${b.url||'#'}" target="_blank" style="flex:1;background:${b.color}12;border:1px solid ${b.color}30;border-radius:10px;padding:7px 8px;display:flex;align-items:center;gap:6px;text-decoration:none">
      <span style="font-size:16px">${b.icon}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:9px;color:#aaa">AD · ${b.side}</div>
        <div style="font-size:11px;font-weight:700;color:${b.color};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${b.name}</div>
        <div style="font-size:10px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${b.product}</div>
      </div>
      <span style="font-size:11px;color:${b.color};font-weight:700;flex-shrink:0">구매→</span>
    </a>`).join("")}</div>`;
}

// ── AI 호출 ──
async function callAI(prompt){
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-lite:generateContent?key=${S.apiKey}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
  const data=await res.json();
  if(data.error)throw new Error(data.error.message||JSON.stringify(data.error));
  const text=data.candidates?.[0]?.content?.parts?.[0]?.text||"";
  const s=text.indexOf("{"),e=text.lastIndexOf("}");
  if(s<0||e<0)throw new Error("JSON 파싱 실패");
  return JSON.parse(text.slice(s,e+1));
}

function showLoad(msg){
  const el=document.createElement("div");el.id="load-p";el.className="load-popup";
  el.innerHTML=`<div class="load-card"><div style="font-size:36px;margin-bottom:12px">👨‍🍳</div><div style="font-weight:800;font-size:16px;margin-bottom:6px">${msg}</div><div style="font-size:13px;color:var(--text-sub)">잠깐만요...</div><div style="margin-top:14px;height:4px;background:var(--border);border-radius:4px;overflow:hidden"><div style="height:100%;background:var(--primary);border-radius:4px;animation:loadBar 1.5s ease infinite"></div></div></div>`;
  document.body.appendChild(el);
}
function hideLoad(){const e=document.getElementById("load-p");if(e)e.remove();}

function showAd(onFinish){
  const el=document.createElement("div");el.className="overlay";el.id="ad-ol";
  el.innerHTML=`<div style="font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:2px">ADVERTISEMENT</div><div class="ad-box"><div style="font-size:44px">🛒</div><div style="color:#fff;font-weight:800;font-size:20px">마켓컬리</div><div style="color:rgba(255,255,255,0.5);font-size:12px">신선식품 새벽배송</div></div><div style="width:320px"><div style="height:3px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden;margin-bottom:12px"><div id="ad-fill" style="height:100%;background:var(--primary);width:0%;transition:width 1s linear;border-radius:4px"></div></div><div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;align-items:center;gap:8px"><div id="ai-dot" style="width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2)"></div><div id="ai-txt" style="color:rgba(255,255,255,0.4);font-size:12px">AI가 식단을 분석하고 있어요...</div></div><div style="color:#fff;font-size:22px;font-weight:900" id="ad-cnt">5초</div></div></div>`;
  document.body.appendChild(el);
  let cnt=5,adDone=false,aiDone=false,aiErr=null;
  const t=setInterval(()=>{cnt--;const c=document.getElementById("ad-cnt");const f=document.getElementById("ad-fill");if(c)c.textContent=cnt>0?cnt+"초":"완료!";if(f)f.style.width=((5-cnt)/5*100)+"%";if(cnt<=0){clearInterval(t);adDone=true;if(aiDone)finish();}},1000);
  onFinish().then(()=>{aiDone=true;const dot=document.getElementById("ai-dot");const txt=document.getElementById("ai-txt");if(dot)dot.style.background="#4caf50";if(txt){txt.textContent="완료 ✓";txt.style.color="#4caf50";}if(adDone)finish();}).catch(e=>{aiErr=e;aiDone=true;if(adDone)finish();});
  function finish(){const o=document.getElementById("ad-ol");if(o)o.remove();if(aiErr)alert("식단 생성 실패: "+aiErr.message);}
}

render("splash");
</script>
