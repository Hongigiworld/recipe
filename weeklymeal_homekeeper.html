<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Weekly Meal - Homekeeper</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#f0f0f0;display:flex;justify-content:center;min-height:100vh;}
#app{width:100%;max-width:480px;min-height:100vh;background:#fff;display:flex;flex-direction:column;}
.screen{flex:1;overflow-y:auto;padding-bottom:72px;}
.tab-bar{position:fixed;bottom:0;width:100%;max-width:480px;display:flex;border-top:1px solid #f0f0f0;background:#fff;z-index:50;}
.tab-btn{flex:1;padding:10px 0 8px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;position:relative;}
button{cursor:pointer;font-family:inherit;border:none;}
input,select,textarea{font-family:inherit;}
/* 레이아웃 */
.pad{padding:32px 20px 20px;}
.px{padding:0 20px;}
.title{font-weight:900;font-size:22px;letter-spacing:-0.5px;color:#1a1a1a;}
.sub{font-size:13px;color:#999;margin-top:4px;line-height:1.5;}
.back{background:none;border:none;font-size:22px;padding:0;color:#333;margin-bottom:14px;display:block;}
.sec{font-size:11px;font-weight:700;color:#aaa;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:8px;}
.card{background:#f8f8f8;border-radius:16px;padding:16px;}
/* 버튼 */
.btn-g{background:#4caf50;color:#fff;border-radius:14px;padding:15px;font-weight:800;font-size:15px;width:100%;}
.btn-g:disabled{background:#ddd;color:#aaa;cursor:not-allowed;}
.btn-p{background:#e91e63;color:#fff;border-radius:14px;padding:15px;font-weight:800;font-size:15px;width:100%;}
.btn-o{background:#ff9800;color:#fff;border-radius:14px;padding:15px;font-weight:800;font-size:15px;width:100%;}
.btn-gray{background:#f0f0f0;color:#555;border-radius:14px;padding:15px;font-weight:700;font-size:15px;width:100%;}
.bottom-bar{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:10px 20px;background:#fff;border-top:1px solid #f0f0f0;z-index:20;}
/* 입력 */
.inp{padding:11px 13px;border-radius:12px;border:1.5px solid #e8e8e8;font-size:14px;outline:none;background:#fafafa;}
.inp:focus{border-color:#4caf50;background:#fff;}
.sel{padding:11px 8px;border-radius:12px;border:1.5px solid #e8e8e8;font-size:13px;outline:none;background:#fafafa;color:#444;}
/* 냉장고 */
.fi{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#f8f8f8;border-radius:12px;margin-bottom:6px;}
.fi.urgent{background:#fff5f5;border:1px solid #ffcdd2;}
.fi.warning{background:#fff8e1;border:1px solid #ffe082;}
.dday{color:#fff;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;display:inline-block;}
/* 식단 */
.day-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 20px 12px;scrollbar-width:none;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{flex-shrink:0;min-width:42px;height:42px;border-radius:12px;border:2px solid #f0f0f0;background:#f8f8f8;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px;}
.day-tab.active{background:#4caf50;border-color:#4caf50;}
.meal-card{background:#f8f8f8;border-radius:16px;padding:14px;margin-bottom:8px;cursor:pointer;}
.meal-card:active{transform:scale(0.98);}
.mtag{background:#fff;border:1px solid #e8e8e8;border-radius:20px;padding:2px 9px;font-size:11px;color:#666;display:inline-block;margin:2px;}
.ctag{background:#fff8e1;border-color:#ffe082;color:#f57c00;}
.stag{background:#e8f5e9;border-color:#a5d6a7;color:#2e7d32;}
.nut-row{display:flex;gap:6px;margin-top:8px;}
.nut-chip{flex:1;background:#fff;border-radius:8px;padding:6px 4px;text-align:center;border:1px solid #f0f0f0;}
/* 장보기 */
.shop-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1.5px solid #f0f0f0;border-radius:12px;margin-bottom:6px;}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chk.done{background:#4caf50;border-color:#4caf50;}
/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal-card{background:#fff;border-radius:24px 24px 0 0;padding:24px 20px 40px;width:100%;max-width:480px;}
/* 아코디언 */
.ac-cat{border:1.5px solid #f0f0f0;border-radius:14px;overflow:hidden;margin-bottom:8px;}
.ac-cat-btn{width:100%;padding:14px 16px;background:#fff;border:none;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;color:#1a1a1a;}
.ac-sub-btn{width:100%;padding:11px 16px;background:#fafafa;border:none;border-top:1px solid #f5f5f5;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:#444;}
.ac-items{padding:10px 14px;display:flex;flex-wrap:wrap;gap:7px;border-top:1px solid #f5f5f5;}
.itag{padding:6px 12px;border-radius:20px;border:1.5px solid #e8e8e8;background:#fff;font-size:13px;color:#444;}
.itag.sel{background:#e8f5e9;border-color:#4caf50;color:#2e7d32;font-weight:700;}
/* 광고/로딩 */
.overlay{position:fixed;inset:0;background:rgba(8,8,8,0.96);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
.ad-box{width:310px;height:170px;background:linear-gradient(135deg,#0f0c29,#302b63);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1px solid #3a3a5c;}
.load-popup{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:998;display:flex;align-items:flex-end;justify-content:center;}
.load-card{background:#fff;border-radius:24px 24px 0 0;padding:28px 24px 40px;width:100%;max-width:480px;text-align:center;}
/* 스플래시 */
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:10px;background:linear-gradient(160deg,#e8f5e9,#fff);}
/* 쿠폰 */
.coupon{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;margin-bottom:8px;}
/* 식사 설정 */
.meal-slot-btn{flex:1;padding:8px 4px;border-radius:10px;border:2px solid #eee;background:#fff;font-size:12px;font-weight:600;color:#aaa;text-align:center;}
.meal-slot-btn.on-breakfast{border-color:#ff9800;background:#fff8e1;color:#f57c00;}
.meal-slot-btn.on-lunch{border-color:#4caf50;background:#e8f5e9;color:#2e7d32;}
.meal-slot-btn.on-dinner{border-color:#e91e63;background:#fce4ec;color:#e91e63;}
@keyframes splashLoad{from{width:0}to{width:100%}}
@keyframes loadBar{0%{width:0%;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0%;margin-left:100%}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ════════════════════════════
// 브랜드 DB
// ════════════════════════════
const BRAND_DB={
  김치:[{name:"종갓집",product:"포기김치 3kg",icon:"🥬",color:"#c62828",until:"2025-12-31"},{name:"비비고",product:"썰은김치 500g",icon:"🥬",color:"#d32f2f",until:"2025-11-30"}],
  고추장:[{name:"순창",product:"태양초 고추장",icon:"🌶️",color:"#b71c1c",until:"2025-12-31"}],
  된장:[{name:"청정원",product:"명품 된장",icon:"🥣",color:"#795548",until:"2025-12-31"}],
  참기름:[{name:"오뚜기",product:"참기름 320ml",icon:"🫙",color:"#f57c00",until:"2025-12-31"}],
  간장:[{name:"샘표",product:"501 진간장",icon:"🍶",color:"#4e342e",until:"2025-12-31"}],
  기타:[{name:"CJ",product:"햇반 210g x3",icon:"🍚",color:"#1976d2",until:"2025-12-31"},{name:"동원",product:"참치캔 x3",icon:"🐟",color:"#0288d1",until:"2025-11-30"}],
};
const SIDE_MAP={김치:"김치",깍두기:"김치",고추장:"고추장",된장:"된장",참기름:"참기름",나물:"참기름",간장:"간장",조림:"간장"};
function getBrands(side){for(const[k,c]of Object.entries(SIDE_MAP))if(side.includes(k))return(BRAND_DB[c]||[]).filter(b=>new Date(b.until)>=new Date());return(BRAND_DB.기타||[]).filter(b=>new Date(b.until)>=new Date());}

// ════════════════════════════
// 재료 DB
// ════════════════════════════
const ING_DB={
  "🥩 육류":{소고기:["안심","등심","채끝","꽃등심","갈비살","부채살","양지머리","사태","우둔살","설도","치마살","스지","곱창","사골"],돼지고기:["삼겹살","목살","앞다리살","뒷다리살","안심","등심","갈비","항정살","가브리살","오겹살","족발","등뼈"],닭고기:["닭가슴살","닭다리","닭날개","닭안심","닭발","닭똥집","통닭","닭볶음탕용"],가공육:["베이컨","햄","소시지","스팸","핫도그","육포"]},
  "🐟 해산물":{흰살생선:["대구","명태","동태","황태","조기","광어","도미","농어","갈치","삼치","우럭","볼락","가자미"],붉은살:["참치","고등어","꽁치","연어","방어","멸치"],갑각류:["새우","꽃게","대게"],조개패류:["바지락","홍합","가리비","전복","굴"],"오징어낙지":["오징어","낙지","문어","주꾸미"],건어물:["멸치","다시마","미역","김","건새우","황태채"]},
  "🥬 채소":{잎채소:["배추","양배추","상추","깻잎","시금치","청경채","쑥갓","미나리","열무","아욱","케일"],뿌리채소:["당근","무","감자","고구마","양파","마늘","생강","연근","우엉","비트"],열매채소:["토마토","파프리카","고추","청양고추","홍고추","오이","호박","애호박","가지","피망","방울토마토","옥수수"],줄기채소:["대파","쪽파","아스파라거스","브로콜리","콜리플라워"],버섯:["표고버섯","느타리버섯","팽이버섯","새송이버섯","양송이버섯"],"콩두부":["두부","순두부","연두부","콩나물","숙주","유부"]},
  "🌾 곡물면":{쌀류:["쌀","찹쌀","현미","흑미","보리","귀리"],면류:["소면","중면","칼국수면","우동면","라면","당면","쌀국수","스파게티","냉면"],빵떡:["식빵","바게트","또띠아","떡국떡","가래떡","인절미"],가루류:["밀가루","부침가루","튀김가루","전분"]},
  "🥚 유제품달걀":{달걀:["달걀","메추리알"],유제품:["우유","두유","생크림","버터","치즈","슬라이스치즈","크림치즈","모짜렐라","요거트"]},
  "🧄 양념소스":{기본양념:["소금","설탕","후추","고추장","된장","간장","쌈장","고춧가루","참기름","들기름","식용유","올리브오일","식초","미림","청주","굴소스","멸치액젓","새우젓"],소스:["케첩","마요네즈","머스타드","토마토소스","돈까스소스","데리야끼소스"],국물베이스:["멸치다시마육수","사골육수","닭육수","치킨스톡"]},
  "🌿 향신료허브":{향신료:["계피","커민","강황","카레가루","파프리카파우더"],허브:["오레가노","타임","로즈마리","바질","파슬리"]},
  "🍎 과일견과":{과일:["사과","배","귤","딸기","수박","복숭아","포도","바나나","망고"],견과류:["땅콩","호두","아몬드","잣","참깨","들깨"]},
};

// ════════════════════════════
// 상태
// ════════════════════════════
const DAYS=["월","화","수","목","금","토","일"];
const MEAL_TYPES=["아침","점심","저녁"];

// 기본 식사 스케줄 (각 요일별 먹을 끼니)
const DEFAULT_SCHEDULE={월:["점심","저녁"],화:["아침","점심","저녁"],수:["아침","점심","저녁"],목:["아침","점심","저녁"],금:["점심","저녁"],토:["아침","저녁"],일:["아침","저녁"]};

const S={
  apiKey:localStorage.getItem("wm_key")||"",
  screen:"splash",
  people:2,
  // 냉장고 - storage hub
  fridge:JSON.parse(localStorage.getItem("wm_fridge")||"[]"),
  // 식사 스케줄
  schedule:JSON.parse(localStorage.getItem("wm_schedule")||JSON.stringify(DEFAULT_SCHEDULE)),
  // 식단
  mealPlan:JSON.parse(localStorage.getItem("wm_meal")||"null"),
  mealStartDate:localStorage.getItem("wm_meal_start")||null,
  // 장보기
  cart:[],
  fridgeAdded:false,
  // B/C
  bcMode:"",
  bcStyles:[],
  bcMenus:[],
  bcSuggested:[],
  // A 재료 탐색
  openCats:{},openSubs:{},ingSearch:"",pendingIng:null,
  // 주 사용횟수
  weekUsage:parseInt(localStorage.getItem("wm_week_"+weekKey())||"0"),
  currentDay:0,
  currentMeal:null,
  recipeCache:{},
  editIngIdx:-1,
};

function weekKey(){const n=new Date();return n.getFullYear()+"_"+Math.floor((n-new Date(n.getFullYear(),0,0))/604800000);}
function saveFridge(){localStorage.setItem("wm_fridge",JSON.stringify(S.fridge));}
function saveSchedule(){localStorage.setItem("wm_schedule",JSON.stringify(S.schedule));}
function saveMeal(){localStorage.setItem("wm_meal",JSON.stringify(S.mealPlan));localStorage.setItem("wm_meal_start",S.mealStartDate||"");}
function addUsage(){S.weekUsage++;localStorage.setItem("wm_week_"+weekKey(),S.weekUsage);}
function checkUsage(){if(S.weekUsage>=3){alert("이번 주 식단 생성 횟수(3회)를 모두 사용했어요!");return false;}return true;}

// 유통기한 계산
function getDday(addedAt,expireDays){
  const e=new Date(addedAt);e.setDate(e.getDate()+(expireDays||14));
  return Math.ceil((e-new Date())/86400000);
}
function ddayBadge(d){
  const bg=d<=0?"#9e9e9e":d<=3?"#f44336":d<=7?"#ff9800":"#4caf50";
  return`<span class="dday" style="background:${bg}">${d<=0?"만료":"D-"+d}</span>`;
}
function fridgeItemClass(d){return d<=0?"fi":d<=3?"fi urgent":d<=7?"fi warning":"fi";}

// 아이콘
function getIcon(n){const m={당근:"🥕",감자:"🥔",양파:"🧅",대파:"🌿",마늘:"🧄",두부:"🟫",계란:"🥚",달걀:"🥚",고추장:"🌶️",된장:"🥣",간장:"🍶",중면:"🍜",소면:"🍜",쌀:"🌾",삼겹살:"🥩",소고기:"🥩",돼지고기:"🥩",닭:"🍗",배추:"🥬",시금치:"🥬",애호박:"🥒",오이:"🥒",브로콜리:"🥦",버섯:"🍄",파프리카:"🫑",토마토:"🍅",새우:"🦐",오징어:"🦑",연어:"🐟",참기름:"🫙",우유:"🥛",치즈:"🧀",베이컨:"🥓"};for(const[k,v]of Object.entries(m))if(n.includes(k))return v;return"🥬";}

// 총 끼니 수 계산
function totalMeals(){return Object.values(S.schedule).reduce((a,b)=>a+b.length,0);}

// 냉장고 재료 충분한지 체크 (5개 미만이면 부실)
function isFridgePoor(){return S.fridge.filter(i=>getDday(i.addedAt,i.expireDays)>0).length<5;}

// 날짜별 식단 소진 처리
function consumeMealsByDate(){
  if(!S.mealPlan||!S.mealStartDate)return;
  const start=new Date(S.mealStartDate);
  const today=new Date();
  const daysPassed=Math.floor((today-start)/86400000);
  if(daysPassed<0||daysPassed>=7)return;
  // 지난 날들의 재료 소진 처리 (실제로는 AI 추정치라 대략적으로)
  for(let d=0;d<daysPassed;d++){
    const dayPlan=S.mealPlan.weeklyMeal[d];
    if(!dayPlan||dayPlan.consumed)continue;
    dayPlan.consumed=true;
    // 해당 날 메뉴의 mainIngredients를 냉장고에서 줄이기
    for(const meal of dayPlan.meals){
      for(const ing of(meal.mainIngredients||[])){
        const fi=S.fridge.find(f=>f.name===ing||ing.includes(f.name));
        if(fi&&fi.qty>0){fi.qty=Math.max(0,parseFloat(fi.qty)-100);}
      }
    }
  }
  saveFridge();saveMeal();
}

// ════════════════════════════
// 렌더
// ════════════════════════════
function go(s){render(s);}
function render(screen){
  S.screen=screen;
  consumeMealsByDate();
  const noTab=["splash","api"].includes(screen);
  let html=`<div class="screen">`;
  if(screen==="splash")html+=renderSplash();
  else if(screen==="api")html+=renderApi();
  else if(screen==="home")html+=renderHome();
  else if(screen==="schedule")html+=renderSchedule();
  else if(screen==="a-fridge")html+=renderAFridge();
  else if(screen==="a-style")html+=renderAStyle();
  else if(screen==="a-meal")html+=renderMeal("a-meal","#f1f8e9");
  else if(screen==="a-recipe")html+=renderRecipe("a-meal");
  else if(screen==="a-upsell")html+=renderAUpsell();
  else if(screen==="bc-entry")html+=renderBCEntry();
  else if(screen==="b-suggest")html+=renderBSuggest();
  else if(screen==="bc-menus")html+=renderBCMenus();
  else if(screen==="bc-cart")html+=renderBCCart();
  else if(screen==="bc-meal")html+=renderMeal("bc-meal","#fce4ec");
  else if(screen==="bc-recipe")html+=renderRecipe("bc-meal");
  else if(screen==="bc-upsell")html+=renderBCUpsell();
  else if(screen==="tab-fridge")html+=renderFridgeTab();
  else if(screen==="tab-meal")html+=renderMealTab();
  else if(screen==="tab-cart")html+=renderCartTab();
  html+=`</div>`;
  if(!noTab){

async function generateAMeal(){
  if(!checkUsage())return;
  const ingList=S.fridge.map(i=>`${i.name} ${i.qty}${i.unit}`).join(", ");
  const scheduleStr=DAYS.map(d=>`${d}요일: ${(S.schedule[d]||[]).join("·")||"없음"}`).join(", ");

  const prompt=`한국어만. 전문 영양사. ${S.people}인 가구.
스타일: ${S.bcStyles.join("/")}만. 실제 한국인 메뉴만.
냉장고 재료: ${ingList}
식사 스케줄: ${scheduleStr}

규칙:
- 스케줄에 있는 끼니만 생성 (없는 끼니는 null)
- 아침: 가볍고 간단한 것 (죽, 토스트, 계란요리, 시리얼, 과일)
- 점심: 든든한 한 끼 (밥+국+반찬, 면류)
- 저녁: 메인 요리 (구이, 찌개, 볶음 등)
- 같은 메뉴 주 2회 이상 금지
- 냉장고 재료 최대한 활용

function getThisMonday(){
  const d=new Date();
  const day=d.getDay();
  const diff=d.getDate()-day+(day===0?-6:1);
  d.setDate(diff);
  return d.toISOString().slice(0,10);
}

function renderSideBrands(sides){
  const brands=[];const shown=new Set();
  for(const s of sides){for(const b of getBrands(s)){if(!shown.has(b.name)){shown.add(b.name);brands.push(b);if(brands.length>=2)break;}}if(brands.length>=2)break;}
  if(!brands.length)return"";
  return`<div style="display:flex;gap:6px;margin-top:6px">${brands.map(b=>`<div style="flex:1;background:${b.color}18;border:1px solid ${b.color}30;border-radius:10px;padding:6px 8px;display:flex;align-items:center;gap:6px"><span style="font-size:15px">${b.icon}</span><div><div style="font-size:9px;color:#aaa">AD</div><div style="font-size:11px;font-weight:700;color:${b.color}">${b.name}</div><div style="font-size:10px;color:#999">${b.product}</div></div></div>`).join("")}</div>`;
}

async function fetchRecipe(menuName,backScreen){
  if(S.recipeCache[menuName]){S.currentMeal={...S.currentMeal,recipe:S.recipeCache[menuName]};render(S.screen);return;}
  showLoading(`${menuName} 레시피 불러오는 중...`);
  try{
    const r=await callGroq(`한국어만. "${menuName}" ${S.people}인분 레시피. JSON만:{"ingredients":[{"name":"재료","amount":"100g"}],"steps":["1. 손질한다","2. 조리한다","3. 완성"]}`);
    S.recipeCache[menuName]=r;S.currentMeal={...S.currentMeal,recipe:r};hideLoading();render(S.screen);
  }catch(e){hideLoading();alert("레시피 실패: "+e.message);}
}

function addCMenu(){
  const i=document.getElementById("c-inp");
  const v=i.value.trim();
  const max=totalMeals();
  if(v&&!S.bcMenus.includes(v)&&S.bcMenus.length<max)S.bcMenus.push(v);
  i.value="";render("bc-entry");
}
function toggleCMenu(m){
  const max=totalMeals();
  const i=S.bcMenus.indexOf(m);
  if(i>=0)S.bcMenus.splice(i,1);
  else if(S.bcMenus.length<max)S.bcMenus.push(m);
  render("bc-entry");
}

async function generateBSuggest(){
  const max=totalMeals();
  const scheduleStr=DAYS.map(d=>`${d}: ${(S.schedule[d]||[]).join("·")||"없음"}`).join(", ");
  showLoading("메뉴를 추천하고 있어요...");
  try{
    const r=await callGroq(`한국어만. ${S.bcStyles.join("/")} 스타일로 총 ${max}개 메뉴 추천.
식사 스케줄: ${scheduleStr}
- 아침 메뉴: 가볍고 간단한 것
- 점심 메뉴: 든든한 것
- 저녁 메뉴: 메인 요리
- 재료 최대한 겹치게
- 실제 한국인이 먹는 메뉴만
JSON만:{"menus":[{"name":"된장찌개","type":"저녁","ingredients":["두부","대파","된장"],"sharedWith":["순두부찌개"]},{"name":"계란토스트","type":"아침","ingredients":["계란","식빵"],"sharedWith":[]}]}`);
    S.bcSuggested=(r.menus||[]).map(m=>({...m,selected:false}));
    hideLoading();go("b-suggest");
  }catch(e){hideLoading();alert("추천 실패: "+e.message);}
}

function renderBSuggest(){

async function generateBCCart(){
  const max=totalMeals();
  const scheduleStr=DAYS.map(d=>`${d}: ${(S.schedule[d]||[]).join("·")||"없음"}`).join(", ");
  showLoading("재료를 분석하고 있어요...");
  try{
    // C에서 메뉴가 max보다 적으면 AI로 자동완성
    let prompt;
    if(S.bcMode==="c"&&S.bcMenus.length<max){
      prompt=`한국어만. 다음 메뉴들을 포함해서 총 ${max}개로 일주일 식단 완성.
식사 스케줄: ${scheduleStr}
기입된 메뉴: ${S.bcMenus.join(", ")}
비슷한 스타일로 나머지 ${max-S.bcMenus.length}개 자동추천.
아침: 간단한 것, 점심: 든든한 것, 저녁: 메인요리.
${S.people}인분 재료 목록도 함께. 중복합산. 채소/단백질/양념/면·밥/기타 분류.
JSON만:{"completedMenus":["메뉴1","메뉴2"],"shoppingList":[{"name":"삼겹살","amount":"600g","icon":"🥩","category":"단백질","usedIn":"삼겹살구이"}]}`;
    }else{
      prompt=`한국어만. 다음 메뉴 ${S.people}인분 재료. 중복합산. 채소/단백질/양념/면·밥/기타 분류.
메뉴: ${S.bcMenus.join(", ")}
JSON만:{"shoppingList":[{"name":"삼겹살","amount":"600g","icon":"🥩","category":"단백질","usedIn":"삼겹살구이"},{"name":"두부","amount":"1모","icon":"🟫","category":"단백질","usedIn":"된장찌개"}]}`;
    }
    const r=await callGroq(prompt);
    if(r.completedMenus)S.bcMenus=[...new Set([...S.bcMenus,...r.completedMenus])];
    S.cart=(r.shoppingList||[]).map(i=>({...i,checked:false,customQty:"",replaceName:"",replaceQty:""}));
    S.fridgeAdded=false;
    hideLoading();go("bc-cart");
  }catch(e){hideLoading();alert("재료 분석 실패: "+e.message);}
}

let editCartIdx=-1;
function openEditCartItem(idx){
  editCartIdx=idx;
  document.getElementById("cart-edit-title").textContent=S.cart[idx].name;
  document.getElementById("cart-edit-name").value=S.cart[idx].replaceName||"";
  document.getElementById("cart-edit-qty").value=S.cart[idx].replaceQty||S.cart[idx].customQty||S.cart[idx].amount;
  document.getElementById("cart-edit-modal").style.display="flex";
}
function confirmCartEdit(){
  const name=document.getElementById("cart-edit-name").value.trim();
  const qty=document.getElementById("cart-edit-qty").value.trim();
  if(name)S.cart[editCartIdx].replaceName=name;
  if(qty)S.cart[editCartIdx].replaceQty=qty;
  document.getElementById("cart-edit-modal").style.display="none";
  render("bc-cart");
}

function addToFridge(){
  // 체크된 재료 냉장고에 추가 (대체재료 반영)
  for(const item of S.cart.filter(i=>i.checked)){
    const name=item.replaceName||item.name;
    const amt=item.replaceQty||item.customQty||item.amount;
    if(!S.fridge.find(f=>f.name===name)){
      S.fridge.push({
        name,
        qty:amt.replace(/[^0-9.]/g,"")||"적당량",
        unit:amt.replace(/[0-9.]/g,"").trim()||"",
        icon:getIcon(name),
        addedAt:new Date().toISOString().slice(0,10),
        expireDays:14
      });
    }
  }
  saveFridge();
  S.fridgeAdded=true;
  render("bc-cart");
}

  const expire=parseInt(document.getElementById("ftab-expire").value)||14;

  const item={name,qty:qty||"적당량",unit:qty?unit:"",icon:getIcon(name),addedAt:new Date().toISOString().slice(0,10),expireDays:expire};
  if(ftabEditIdx>=0)S.fridge[ftabEditIdx]=item;else S.fridge.push(item);
  saveFridge();document.getElementById("ftab-modal").style.display="none";render("tab-fridge");
}

function renderMealTab(){
  const plan=S.mealPlan;
  if(!plan)return`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;padding:20px"><div style="font-size:52px">📅</div><div style="font-weight:700;font-size:18px">아직 식단이 없어요</div><div style="font-size:13px;color:#aaa;text-align:center">홈에서 식단을 만들어보세요</div><button class="btn-g" style="width:auto;padding:12px 24px" onclick="go('home')">홈으로 가기</button></div>`;
  const typeIcon={"아침":"🌅","점심":"☀️","저녁":"🌙"};
  const today=new Date();
  const start=S.mealStartDate?new Date(S.mealStartDate):null;
  const todayDayIdx=start?Math.min(Math.max(Math.floor((today-start)/86400000),0),6):0;

  return`
  <div class="pad">
    <div class="title">📅 이번 주 식단</div>
    ${S.mealStartDate?`<div class="sub">${S.mealStartDate} 시작 · 오늘: ${DAYS[todayDayIdx]}요일</div>`:""}
  </div>
  <div class="day-tabs">
    ${DAYS.map((d,i)=>{
      const meals=plan.weeklyMeal?.[i]?.meals||[];
      const isToday=i===todayDayIdx;
      return`<button class="day-tab ${S.currentDay===i?"active":""}" onclick="S.currentDay=${i};render('tab-meal')">
        <span style="font-size:11px;font-weight:700;color:${S.currentDay===i?"#fff":"#888"}">${d}${isToday?"•":""}</span>
        <span style="font-size:9px;color:${S.currentDay===i?"rgba(255,255,255,0.7)":"#ccc"}">${meals.length}끼</span>
      </button>`;
    }).join("")}
  </div>
  <div class="px" style="padding-bottom:20px">
    ${(plan.weeklyMeal?.[S.currentDay]?.meals||[]).map((m,i)=>`
    <div class="meal-card" onclick="S.currentMeal=m;go('a-recipe')">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
        <span style="font-size:14px">${typeIcon[m.type]||""}</span>
        <span style="font-size:10px;color:#aaa;font-weight:700">${m.type}</span>
      </div>
      <div style="font-weight:700;font-size:14px">${m.name}</div>
      ${m.cookTime?`<div style="font-size:11px;color:#f57c00;margin-top:2px">⏱ ${m.cookTime}분</div>`:""}
    </div>`).join("")||`<div style="text-align:center;color:#ccc;padding:24px;font-size:13px">이 날은 식사 계획이 없어요</div>`}
  </div>`;
}

function renderCartTab(){
  if(!S.cart||S.cart.length===0)return`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;padding:20px"><div style="font-size:52px">🛒</div><div style="font-weight:700;font-size:18px">장보기 목록이 없어요</div><div style="font-size:13px;color:#aaa;text-align:center">먹고 싶은 메뉴를 선택하면<br>여기에 저장돼요</div><button class="btn-p" style="width:auto;padding:12px 24px" onclick="go('home')">홈으로 가기</button></div>`;
  const cats=["채소","단백질","양념","면·밥","기타"];
  const catIcon={채소:"🥬",단백질:"🥩",양념:"🧄","면·밥":"🍚",기타:"🛒"};
  const done=S.cart.filter(i=>i.checked).length;
  return`
  <div class="pad">
    <div class="title">🛒 장보기 목록</div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
      <div style="flex:1;height:5px;background:#f0f0f0;border-radius:4px;overflow:hidden"><div style="height:100%;background:#4caf50;width:${S.cart.length?Math.round(done/S.cart.length*100):0}%;border-radius:4px"></div></div>
      <span style="font-size:12px;color:#aaa">${done}/${S.cart.length}</span>
    </div>
  </div>
  <div class="px" style="padding-bottom:20px">
    ${cats.map(cat=>{
      const items=S.cart.filter(i=>(i.category||"기타")===cat);
      if(!items.length)return"";
      return`<div style="margin-bottom:14px"><div class="sec">${catIcon[cat]} ${cat}</div>${items.map(item=>{const idx=S.cart.indexOf(item);return`<div class="shop-item"><div class="chk ${item.checked?"done":""}" onclick="S.cart[${idx}].checked=!S.cart[${idx}].checked;render('tab-cart')">${item.checked?'<span style="color:#fff;font-size:11px">✓</span>':""}</div><span style="font-size:20px">${item.icon||"🥬"}</span><div style="flex:1" onclick="S.cart[${idx}].checked=!S.cart[${idx}].checked;render('tab-cart')"><div style="font-weight:600;font-size:14px;text-decoration:${item.checked?"line-through":"none"};color:${item.checked?"#bbb":"#1a1a1a"}">${item.name}</div><div style="font-size:11px;color:#aaa">${item.customQty||item.amount}${item.usedIn?" · "+item.usedIn:""}</div></div></div>`;}).join("")}</div>`;
    }).join("")}
    ${done>0?`<button onclick="S.cart=S.cart.filter(i=>!i.checked);render('tab-cart')" style="width:100%;padding:12px;background:none;border:1.5px solid #ddd;border-radius:12px;color:#aaa;font-size:13px;margin-bottom:10px">완료 항목 삭제</button>`:""}
  </div>`;
}

async function callGroq(prompt){
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key":S.apiKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify({
      model:"claude-sonnet-4-5",
      max_tokens:4000,
      messages:[{role:"user",content:prompt}]
    })
  });
  const data=await res.json();
  if(data.error)throw new Error(data.error.message||JSON.stringify(data.error));
  const text=data.content?.find(b=>b.type==="text")?.text||"";
  const s=text.indexOf("{"),e=text.lastIndexOf("}");
  if(s<0||e<0)throw new Error("JSON 파싱 실패");
  return JSON.parse(text.slice(s,e+1));
}

function showAd(onFinish){
  const el=document.createElement("div");el.className="overlay";el.id="ad-ol";
  el.innerHTML=`<div style="color:#555;font-size:10px;letter-spacing:2px">광고</div><div class="ad-box"><div style="font-size:42px">🛒</div><div style="color:#fff;font-weight:800;font-size:18px">마켓컬리</div><div style="color:#777;font-size:12px">신선식품 새벽배송</div></div><div style="width:310px;height:4px;background:#222;border-radius:4px;overflow:hidden"><div id="ad-fill" style="height:100%;background:linear-gradient(90deg,#4caf50,#8bc34a);width:0%;transition:width 1s linear;border-radius:4px"></div></div><div style="color:#fff;font-size:24px;font-weight:900" id="ad-cnt">10초</div><div style="display:flex;align-items:center;gap:8px"><div id="ai-dot" style="width:8px;height:8px;border-radius:50%;background:#333;transition:all 0.4s"></div><div id="ai-txt" style="color:#666;font-size:12px">AI가 식단을 분석하고 있어요...</div></div>`;
  document.body.appendChild(el);
  let cnt=10,adDone=false,aiDone=false,aiErr=null;
  const t=setInterval(()=>{cnt--;const c=document.getElementById("ad-cnt");const f=document.getElementById("ad-fill");if(c)c.textContent=cnt>0?cnt+"초":"완료!";if(f)f.style.width=((10-cnt)/10*100)+"%";if(cnt<=0){clearInterval(t);adDone=true;if(aiDone)finish();}},1000);
  onFinish().then(()=>{aiDone=true;const dot=document.getElementById("ai-dot");const txt=document.getElementById("ai-txt");if(dot){dot.style.background="#4caf50";dot.style.boxShadow="0 0 8px #4caf50";}if(txt){txt.textContent="식단 생성 완료 ✓";txt.style.color="#4caf50";txt.style.fontWeight="700";}if(adDone)finish();}).catch(e=>{aiErr=e;aiDone=true;if(adDone)finish();});
  function finish(){const o=document.getElementById("ad-ol");if(o)o.remove();if(aiErr)alert("식단 생성 실패: "+aiErr.message);}
}

function showLoading(msg){const el=document.createElement("div");el.id="load-popup";el.className="load-popup";el.innerHTML=`<div class="load-card"><div style="font-size:36px;margin-bottom:12px">👨‍🍳</div><div style="font-weight:700;font-size:16px;margin-bottom:6px">${msg}</div><div style="font-size:13px;color:#aaa">잠깐만요...</div><div style="margin-top:14px;height:4px;background:#f0f0f0;border-radius:4px;overflow:hidden"><div style="height:100%;background:#4caf50;border-radius:4px;animation:loadBar 1.5s ease infinite"></div></div></div>`;document.body.appendChild(el);}
function hideLoading(){const e=document.getElementById("load-popup");if(e)e.remove();}

render("splash");
